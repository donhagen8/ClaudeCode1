version: "3.8"
services:
  stirling-pdf:
    image: frooodle/s-pdf:latest
    ports:
      - "8080:8080"
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
    volumes:
      - stirling-data:/usr/share/tessdata
    restart: unless-stopped
    mem_limit: 2g

volumes:
  stirling-data:
